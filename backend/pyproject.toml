[project]
name = "societyiq-backend"
version = "0.1.0"
description = "SocietyIQ API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.161.1",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
